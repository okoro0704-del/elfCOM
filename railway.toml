# Railway — ElfCom API only (@elfcom/node)
# Dockerfile.elfcom-node keeps prisma/schema + migrations on the runtime image.
# Prefer migrate deploy (additive) over db push (can refuse shared-table diffs).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.elfcom-node"

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy --schema=./prisma/schema.prisma && node dist/index.js'"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 100

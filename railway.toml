# Railway / Railpack — ElfCom API only (@elfcom/node)
# Do NOT set the service to @elfcom/lifeos-adapter — that is a client library for LifeOS.
#
# Required env:
#   LIFEOS_JWT_SECRET=...
#   ELFCOM_NODE_MASTER_KEY=...
#   CORS_ORIGINS=https://your-console.netlify.app
#   HOST=0.0.0.0
# Optional: DATABASE_URL, PORT (Railway sets PORT)

[build]
builder = "RAILPACK"
buildCommand = "npm run build --workspace=@elfcom/node"

[deploy]
startCommand = "npm run start:migrate --workspace=@elfcom/node"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 30

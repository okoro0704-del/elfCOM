# Prefer the repo-root netlify.toml when deploying the monorepo.
# If Netlify's base directory is set to apps/web, use these paths instead:
[build]
  command = "cd ../.. && npm install && npm run build -w @elfcom/web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

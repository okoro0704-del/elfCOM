# Used when Netlify packagePath / base is apps/web (CLI --filter=@elfcom/web).
# Install from monorepo root so workspace packages resolve.
[build]
  command = "npm --prefix ../.. install && npm --prefix ../.. run build -w @elfcom/web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
